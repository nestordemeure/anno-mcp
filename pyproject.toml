[project]
name = "anno-mcp"
version = "0.1.0"
description = "MCP server for searching ANNO, the Austrian Newspapers Online archive of the Österreichische Nationalbibliothek"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
anno = "anno_mcp.cli:main"
anno-mcp = "anno_mcp.server:main"
anno-mcp-install = "anno_mcp.install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anno_mcp"]
